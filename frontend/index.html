<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Workflows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">◆</div>
          <div>
            <h1>Agentic Workflows</h1>
            <p class="tagline">Inbound → meetings → revenue</p>
          </div>
        </div>

        <div class="status-card">
          <div class="status-row">
            <span>Backend</span>
            <span id="status-dot" class="dot dot-idle">checking…</span>
          </div>
          <div class="status-row">
            <span>LLM provider</span>
            <span id="provider" class="pill">—</span>
          </div>
          <div class="status-row">
            <span>Tools</span>
            <span id="tool-count" class="pill">—</span>
          </div>
        </div>

        <div class="hints">
          <p class="hints-title">Try the revenue tools</p>
          <button
            class="hint"
            data-msg="score lead: title=VP Marketing; company_size=800; source=demo_request; signal=viewed pricing 3x"
          >
            Score an inbound lead
          </button>
          <button
            class="hint"
            data-msg="qualify: budget=yes; authority=yes; need=yes; timeline=no"
          >
            Qualify with BANT
          </button>
          <button
            class="hint"
            data-msg="forecast: leads=200 meeting_rate=30% close_rate=25% acv=12000"
          >
            Forecast revenue
          </button>
          <button
            class="hint"
            data-msg="draft email: name=Sam; company=Acme; purpose=meeting_request; context=faster onboarding"
          >
            Draft a meeting email
          </button>
          <button class="hint" data-msg="help">What can you do?</button>
        </div>

        <p class="footnote">
          Offline demo mode works with no API key. Set
          <code>OPENAI_API_KEY</code> to enable full LLM reasoning.
        </p>
      </aside>

      <main class="chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <input
            id="input"
            type="text"
            autocomplete="off"
            placeholder="Ask your agent anything…"
          />
          <button id="send" type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
